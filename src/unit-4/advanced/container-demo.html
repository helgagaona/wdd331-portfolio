<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container Query Demo</title>
    <link rel="stylesheet" href="container-demo.css">

</head>
<body>
    <main class="layout">
        <aside class="sidebar">
            <div class="card-container">
                <article class="card">
                    <div class="card-image" aria-hidden="true"></div>
                    <div class="card-content">
                        <h3>Flexible Card</h3>
                        <p>This card stacks its image and text when narrow.</p>
                    </div>
                </article>
            </div>
        </aside>

        <section>
            <div class="card-container">
                <article class="card">
                    <div class="card-image" aria-hidden="true"></div>
                    <div class="card-content">
                        <h3>Flexible Card</h3>
                        <p>This card places its image beside the text when wide.</p>
                    </div>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
